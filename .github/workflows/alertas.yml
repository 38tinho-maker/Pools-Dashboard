name: Alertas de range

on:
  schedule:
    - cron: '*/30 * * * *'   # reserva: religa a corrente se ela parar
  workflow_dispatch:           # botão "Run workflow"

permissions:
  contents: read
  actions: write               # para a execução disparar a próxima sozinha

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restaurar último estado
        uses: actions/cache/restore@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Verificar a cada 5 minutos (por ~55 min)
        run: |
          fim=$((SECONDS + 55*60))
          while true; do
            node scripts/alertas.mjs || echo "falha nesta verificação, tentando de novo em 5 min"
            [ $((SECONDS + 300)) -ge $fim ] && break
            sleep 300
          done
        env:
          ALERTAS: ${{ vars.ALERTAS }}
          CARTEIRAS: ${{ secrets.CARTEIRAS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
          ALERTA_PADRAO: ${{ vars.ALERTA_PADRAO }}
          LIMITES: ${{ vars.LIMITES }}
          REDES: ${{ vars.REDES }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Salvar estado
        if: always() && hashFiles('.estado/estado.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}

      - name: Disparar a próxima execução
        if: always()
        run: gh workflow run alertas.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
